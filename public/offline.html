<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062b67" />
    <title>Hors ligne — Taxi-Moto</title>
    <style>
      /*
       * Page de SECOURS servie par le Service Worker quand une navigation
       * échoue (réseau instable, DNS, 4G). Aucune ressource externe : elle
       * doit s'afficher même totalement hors ligne.
       */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
        background:
          radial-gradient(120% 80% at 50% 0%, #0b3f92 0%, #062b67 55%, #041c45 100%);
      }

      .wrap {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        margin-bottom: 18px;
        border-radius: 20px;
        font-size: 32px;
        background: linear-gradient(145deg, #ffb52e, #ff9900);
        box-shadow: 0 12px 26px rgba(255, 153, 0, 0.35);
      }

      .card {
        padding: 26px 22px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.3px;
      }

      p {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.78);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff5a5f;
        box-shadow: 0 0 0 4px rgba(255, 90, 95, 0.2);
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        border: none;
        border-radius: 16px;
        color: #062b67;
        background: linear-gradient(135deg, #ffb52e, #ff9900);
        font-family: inherit;
        font-size: 15px;
        font-weight: 900;
        cursor: pointer;
        box-shadow:
          0 7px 0 rgba(178, 106, 0, 0.35),
          0 14px 26px rgba(255, 153, 0, 0.25);
        transition: transform 0.16s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 rgba(178, 106, 0, 0.35);
      }

      .hint {
        margin-top: 14px;
        font-size: 11.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="logo" aria-hidden="true">🛺</div>

      <section class="card">
        <span class="status">
          <span class="dot"></span>
          Connexion perdue
        </span>

        <h1>Vous êtes hors ligne</h1>
        <p>
          Impossible de joindre Taxi-Moto pour le moment. Vérifiez votre connexion
          internet (Wi-Fi ou données mobiles) puis réessayez.
        </p>

        <button type="button" id="retry">Réessayer</button>

        <p class="hint">
          La page se rechargera automatiquement dès le retour de la connexion.
        </p>
      </section>
    </main>

    <script>
      /* Rechargement automatique dès que le réseau revient. */
      window.addEventListener('online', () => window.location.reload());

      document.getElementById('retry').addEventListener('click', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
